name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Check release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
      - name: Run tests
        run: swift test
      - name: Package universal app and cask
        run: bash scripts/package-release.sh "${RELEASE_TAG#v}"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/lp-clock_macOS_universal.zip dist/checksums.txt --clobber
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: eiri/homebrew-tap
          token: ${{ secrets.HOMEBREW_TOKEN }}
          path: .tap
      - name: Publish cask
        run: |
          mkdir -p .tap/Casks
          cp dist/lp-clock.rb .tap/Casks/lp-clock.rb
          cd .tap
          git config user.name eiri
          git config user.email eiri@eiri.ca
          git add Casks/lp-clock.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: brew formula update for lp-clock version $RELEASE_TAG"
          git pull --rebase
          git push
